name: Temporary payment registry refactor v2

on:
  push:
    branches:
      - v1/payment-method-registry

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope ambiguous order snapshot replacement
        shell: python
        run: |
          from pathlib import Path
          p = Path('tools/temp-payment-registry-refactor.php')
          text = p.read_text()
          old = '''replaceOnce('src/Controllers/CommandeController.php', "            'currency'                    => \\$pricing['currency'],\\n            'prix_livraison_cents'        => \\$pricing['prix_livraison_cents'],", "            'currency'                    => \\$pricing['currency'],\\n            'payment_method_code'         => (string) \\$paymentMethod['code'],\\n            'prix_livraison_cents'        => \\$pricing['prix_livraison_cents'],");'''
          new = r'''replaceOnce('src/Controllers/CommandeController.php', <<<'OLD'
          $commandeData = [
              'numero_commande'       => $numeroCommande,
              'utilisateur_id'        => $user['id'],
              'date_prestation'       => sanitize($_POST['date_prestation']  ?? ''),
              'heure_livraison'       => sanitize($_POST['heure_livraison']  ?? ''),
              'adresse_livraison'     => $adresse,
              'ville_livraison'       => $ville,
              'code_postal_livraison' => $codePostal,
              'prix_total_cents'            => $pricing['total_ttc_cents'],
              'currency'                    => $pricing['currency'],
              'prix_livraison_cents'        => $pricing['prix_livraison_cents'],
              'instructions'          => $instructions ?: null,
          ];
          OLD, <<<'NEW'
          $commandeData = [
              'numero_commande'       => $numeroCommande,
              'utilisateur_id'        => $user['id'],
              'date_prestation'       => sanitize($_POST['date_prestation']  ?? ''),
              'heure_livraison'       => sanitize($_POST['heure_livraison']  ?? ''),
              'adresse_livraison'     => $adresse,
              'ville_livraison'       => $ville,
              'code_postal_livraison' => $codePostal,
              'prix_total_cents'            => $pricing['total_ttc_cents'],
              'currency'                    => $pricing['currency'],
              'payment_method_code'         => (string) $paymentMethod['code'],
              'prix_livraison_cents'        => $pricing['prix_livraison_cents'],
              'instructions'          => $instructions ?: null,
          ];
          NEW);'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one ambiguous call to replace, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
      - name: Validate and apply deterministic refactor
        run: |
          php -l tools/temp-payment-registry-refactor.php
          php tools/temp-payment-registry-refactor.php
          rm -f .github/workflows/temp-payment-registry-refactor-v2.yml
      - name: Validate changed PHP syntax and diff
        run: |
          git diff --check
          git diff --name-only --diff-filter=ACM | grep -E '\.php$' | xargs -r -n1 php -l
      - name: Commit deterministic refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Phase 4: wire payment registry across checkout and admin"
          git push
