name: Temporary payment-method settings link

on:
  push:
    branches:
      - v1/payment-method-registry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add discoverable registry link
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/Views/pages/admin/parametres.php')
          text = p.read_text()
          old = '''    <div class="tab-pane fade <?= $activeTab === 'paiement' ? 'show active' : '' ?>" id="pane-paiement" role="tabpanel">
        <div class="card shadow-sm" style="max-width:700px;">
            <div class="card-body">
                <form method="POST" action="/admin/parametres/modifier">'''
          new = '''    <div class="tab-pane fade <?= $activeTab === 'paiement' ? 'show active' : '' ?>" id="pane-paiement" role="tabpanel">
        <div class="card shadow-sm mb-4" style="max-width:700px;">
            <div class="card-body d-flex justify-content-between align-items-start gap-3 flex-wrap">
                <div>
                    <h6 class="fw-semibold mb-1">Moyens de paiement</h6>
                    <p class="text-muted small mb-0">Choisissez les méthodes disponibles au checkout et pour les encaissements employés.</p>
                </div>
                <a href="/admin/parametres?view=payment-methods" class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-credit-card-2-front me-1"></i>Configurer les moyens
                </a>
            </div>
        </div>
        <div class="card shadow-sm" style="max-width:700px;">
            <div class="card-body">
                <form method="POST" action="/admin/parametres/modifier">'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one payment tab anchor, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          Path('.github/workflows/temp-link-payment-methods.yml').unlink()
      - name: Validate and commit
        run: |
          php -l src/Views/pages/admin/parametres.php
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Phase 4: expose payment-method registry in admin"
          git push
