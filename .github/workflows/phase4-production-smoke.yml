name: Phase 4 production smoke

on:
  push:
    branches:
      - v1/policy-generated-terms

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production health and CGV
        shell: bash
        run: |
          set -euo pipefail
          base='https://vite-gourmand-ecf-production-c7ac.up.railway.app'

          health_code="$(curl --silent --show-error --location --output /tmp/health.body --write-out '%{http_code}' --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 "$base/health")"
          test "$health_code" = '200'

          cgv_code="$(curl --silent --show-error --location --output /tmp/cgv.body --write-out '%{http_code}' --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 "$base/cgv")"
          test "$cgv_code" = '200'
          grep -Fq 'Conditions générales de vente' /tmp/cgv.body
          ! grep -Eqi 'Fatal error|Uncaught .*Exception|Parse error' /tmp/cgv.body

          printf 'health=%s cgv=%s\n' "$health_code" "$cgv_code"
