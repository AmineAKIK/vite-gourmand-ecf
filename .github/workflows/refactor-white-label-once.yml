name: One-shot white-label refactor

on:
  push:
    branches:
      - v1/zero-debt-white-label-foundation

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1/zero-debt-white-label-foundation
          fetch-depth: 0

      - name: Replace historical visual and JS namespaces
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('src'), Path('public')]
          replacements = {
              'btn-vg-outline': 'btn-outline-secondary',
              'btn-vg': 'btn-brand',
              'text-vg': 'text-brand',
              'bg-vg': 'bg-brand',
              '--vg-border': '--border-subtle',
              '--vg-bordeaux': '--brand-primary',
              '--vg-or': '--brand-secondary',
              '--vg-creme': '--surface-page',
              '--vg-primary': '--brand-primary',
              '#8B1A2B': '#64748B',
              '#D4A843': '#6B7280',
              '#FDF6EC': '#FFFFFF',
              'window.vgIsAbortError': 'window.tugeresIsAbortError',
              'window.vgFetchJson': 'window.tugeresFetchJson',
              'window.vgDebounce': 'window.tugeresDebounce',
              'window.vgConfirm': 'window.tugeresConfirm',
              'vgConfirmModal': 'confirmModal',
              'vgConfirmTitle': 'confirmTitle',
              'vg-confirm-modal': 'confirm-modal',
              'vg-confirm-dialog': 'confirm-dialog',
              'vg-confirm-content': 'confirm-content',
              'vg-confirm-icon': 'confirm-icon',
              'vg-confirm-body': 'confirm-body',
              'vg-confirm-title': 'confirm-title',
              'vg-confirm-message': 'confirm-message',
              'vg-confirm-actions': 'confirm-actions',
          }

          extensions = {'.php', '.js', '.css', '.html'}
          changed = []
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in extensions:
                      continue
                  text = path.read_text(encoding='utf-8')
                  updated = text
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
                      changed.append(str(path))

          print('Changed files:')
          print('\n'.join(changed))
          PY

      - name: Verify historical visual namespace is gone
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=vendor --exclude='*.map' -- '(--vg-|text-vg|bg-vg|btn-vg|#8B1A2B|#D4A843|#FDF6EC|window\.vg|vg-confirm|vgConfirm)' src public; then
            echo 'Historical white-label markers remain.' >&2
            exit 1
          fi

      - name: Commit refactor
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public
          git commit -m 'Phase 3: remove remaining historical visual namespace'
          git push origin HEAD:v1/zero-debt-white-label-foundation
