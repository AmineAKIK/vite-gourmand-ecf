name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: pr3
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, zip
          coverage: none
          tools: composer:v2, phpunit:10, phpstan:1, php-cs-fixer:3

      - name: Validate Composer metadata
        run: composer validate --strict --no-interaction

      - name: Refresh vulnerable locked packages
        run: composer update dompdf/dompdf guzzlehttp/guzzle guzzlehttp/psr7 --with-all-dependencies --no-progress --no-interaction

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- composer.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock
            git commit -m "chore: refresh vulnerable Composer dependencies"
            git push origin HEAD:pr3
          fi

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

      - name: Lint PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find src public tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Run unit tests
        run: phpunit --configuration phpunit.xml

      - name: Run PHPStan
        run: phpstan analyse --configuration phpstan.neon --no-progress

      - name: Check style of newly added PHP files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --diff-filter=A --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.php' > /tmp/new-php-files.txt
          if [ -s /tmp/new-php-files.txt ]; then
            xargs php-cs-fixer fix --dry-run --diff --using-cache=no --rules=@PER-CS2.0 < /tmp/new-php-files.txt
          else
            echo 'No newly added PHP files to style-check.'
          fi
