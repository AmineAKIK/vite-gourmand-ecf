name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, zip
          coverage: none
          tools: composer:v2, phpunit:10, phpstan:2.2, php-cs-fixer:3

      - name: Validate Composer metadata
        run: composer validate --strict --no-interaction

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

      - name: Lint PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find src public tests bin -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Run unit tests
        run: phpunit --configuration phpunit.xml

      - name: Run PHPStan
        run: phpstan analyse --configuration phpstan.neon --no-progress

      - name: Check style of newly added PHP files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --diff-filter=A --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.php' > /tmp/new-php-files.txt
          if [ -s /tmp/new-php-files.txt ]; then
            while IFS= read -r file; do
              php-cs-fixer fix "$file" --dry-run --diff --using-cache=no --rules=@PER-CS2.0
            done < /tmp/new-php-files.txt
          else
            echo 'No newly added PHP files to style-check.'
          fi

  migrations:
    name: MySQL ${{ matrix.mysql }} migration gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mysql:
          - '8.4'
          - '9.4'

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_DATABASE: tugeres_ci
          MYSQL_USER: tugeres
          MYSQL_PASSWORD: tugeres
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Apply complete migration chain
        env:
          APP_ENV: production
          DB_HOST: 127.0.0.1
          DB_NAME: tugeres_ci
          DB_USER: tugeres
          DB_PASS: tugeres
          TUGERES_ALLOW_HTTP_MIGRATIONS: 'false'
        run: php bin/migrate.php

      - name: Re-run migrations to prove idempotence
        env:
          APP_ENV: production
          DB_HOST: 127.0.0.1
          DB_NAME: tugeres_ci
          DB_USER: tugeres
          DB_PASS: tugeres
          TUGERES_ALLOW_HTTP_MIGRATIONS: 'false'
        run: php bin/migrate.php

      - name: Verify every migration is tracked
        env:
          MYSQL_PWD: tugeres
        shell: bash
        run: |
          set -euo pipefail
          expected="$(find sql/migrations -maxdepth 1 -type f -name '[0-9]*.sql' | wc -l | tr -d ' ')"
          applied="$(mysql --protocol=tcp -h 127.0.0.1 -u tugeres tugeres_ci -Nse 'SELECT COUNT(*) FROM schema_migrations')"
          test "$applied" = "$expected"

  docker:
    name: Production image build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --pull --tag tugeres-ci:${{ github.sha }} .
