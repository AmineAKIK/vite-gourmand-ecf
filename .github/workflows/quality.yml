name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, zip
          coverage: none
          tools: composer:v2, phpunit:10, phpstan:2.2, php-cs-fixer:3

      - name: Validate Composer metadata
        run: composer validate --strict --no-interaction

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

      - name: Lint PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find src public tests bin -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Run unit tests
        run: phpunit --configuration phpunit.xml

      - name: Run PHPStan
        run: phpstan analyse --configuration phpstan.neon --no-progress

      - name: Check style of newly added PHP files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --diff-filter=A --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.php' > /tmp/new-php-files.txt
          if [ -s /tmp/new-php-files.txt ]; then
            while IFS= read -r file; do
              php-cs-fixer fix "$file" --dry-run --diff --using-cache=no --rules=@PER-CS2.0
            done < /tmp/new-php-files.txt
          else
            echo 'No newly added PHP files to style-check.'
          fi

  v1-database:
    name: MySQL 8.4 V1 fresh-install gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: production
      DB_HOST: 127.0.0.1
      DB_NAME: tugeres_ci
      DB_USER: tugeres
      DB_PASS: tugeres

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tugeres_ci
          MYSQL_USER: tugeres
          MYSQL_PASSWORD: tugeres
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prove partial databases fail closed
        shell: bash
        run: |
          set -euo pipefail
          php -r '$db = new PDO("mysql:host=127.0.0.1;dbname=tugeres_ci;charset=utf8mb4", "tugeres", "tugeres", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); $db->exec("CREATE TABLE partial_marker (id INT PRIMARY KEY)");'

          set +e
          output="$(php bin/migrate.php 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -F 'schéma incomplet/incompatible' <<< "$output"

          php -r '$db = new PDO("mysql:host=127.0.0.1;dbname=tugeres_ci;charset=utf8mb4", "tugeres", "tugeres", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); $db->exec("DROP TABLE partial_marker");'

      - name: Provision a truly empty V1 database
        run: php bin/migrate.php

      - name: Verify inventory invariants against MySQL
        run: php bin/verify-inventory-invariants.php

      - name: Verify immutable order status history against MySQL
        run: php bin/verify-order-status-history.php

      - name: Verify canonical schema and snapshot fingerprint
        shell: bash
        run: |
          set -euo pipefail
          php bin/verify-v1-schema.php
          php bin/verify-v1-schema.php --fingerprint > /tmp/v1-before.json

      - name: Re-run provisioning to prove idempotence
        run: php bin/migrate.php

      - name: Prove second pass is a schema no-op
        shell: bash
        run: |
          set -euo pipefail
          php bin/verify-v1-schema.php --fingerprint > /tmp/v1-after.json
          cmp /tmp/v1-before.json /tmp/v1-after.json

  v1-existing-database:
    name: MySQL 8.4 V1 existing-schema gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: production
      DB_HOST: 127.0.0.1
      DB_NAME: tugeres_existing_ci
      DB_USER: tugeres
      DB_PASS: tugeres

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tugeres_existing_ci
          MYSQL_USER: tugeres
          MYSQL_PASSWORD: tugeres
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Build complete historical schema without V1 constraint names
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';

          $db = new PDO(
              'mysql:host=127.0.0.1;dbname=tugeres_existing_ci;charset=utf8mb4',
              'tugeres',
              'tugeres',
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION],
          );
          $sql = file_get_contents('sql/v1/001_v1_baseline.sql');
          if (!is_string($sql)) {
              throw new RuntimeException('Baseline unreadable.');
          }
          foreach (App\Config\SqlStatementSplitter::split($sql) as $statement) {
              $db->exec($statement);
          }
          $db->exec('ALTER TABLE commande DROP CHECK chk_commande_prix_total');
          $db->exec('ALTER TABLE commande_ligne DROP FOREIGN KEY fk_commande_ligne_taux_tva');
          $db->exec('ALTER TABLE commande_ligne DROP CHECK chk_commande_ligne_montants');
          $db->exec('ALTER TABLE paiement DROP CHECK chk_paiement_montant');
          PHP

      - name: Reproduce Railway partial order-history migration state
        run: php bin/prepare-order-history-partial-fixture.php

      - name: Apply forward-only migrations to historical complete schema
        run: php bin/migrate.php

      - name: Verify canonical existing-schema target
        shell: bash
        run: |
          set -euo pipefail
          php bin/verify-v1-schema.php
          php <<'PHP'
          <?php
          $db = new PDO(
              'mysql:host=127.0.0.1;dbname=tugeres_existing_ci;charset=utf8mb4',
              'tugeres',
              'tugeres',
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION],
          );

          $required = [
              'commande' => ['prix_total_cents', 'currency'],
              'commande_ligne' => [
                  'prix_menu_cents',
                  'prix_livraison_cents',
                  'prix_total_ligne_cents',
                  'prix_par_personne_snapshot_cents',
                  'taux_tva_menu_basis_points',
                  'taux_tva_livraison_basis_points',
                  'taux_reduction_basis_points',
                  'remise_appliquee_cents',
                  'taux_tva_menu_id',
                  'taux_tva_livraison_id',
              ],
              'paiement' => ['montant_cents'],
          ];
          $forbidden = [
              'commande' => ['prix_total'],
              'commande_ligne' => [
                  'prix_menu', 'prix_livraison', 'prix_total_ligne',
                  'prix_par_personne_snapshot', 'taux_tva_snapshot',
                  'taux_reduction_snapshot', 'remise_appliquee', 'taux_tva_id',
              ],
              'paiement' => ['montant'],
          ];

          foreach ($required as $table => $columns) {
              $stmt = $db->prepare(
                  'SELECT COLUMN_NAME FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = ?'
              );
              $stmt->execute([$table]);
              $present = array_fill_keys(array_map('strval', $stmt->fetchAll(PDO::FETCH_COLUMN)), true);
              foreach ($columns as $column) {
                  if (!isset($present[$column])) {
                      throw new RuntimeException("Missing canonical column {$table}.{$column}");
                  }
              }
              foreach ($forbidden[$table] as $column) {
                  if (isset($present[$column])) {
                      throw new RuntimeException("Stale column {$table}.{$column}");
                  }
              }
          }

          foreach (['v_paiements_commande', 'v_ca_stats', 'v_ca_commandes', 'v_ca_mensuel', 'v_ca_par_menu'] as $view) {
              $stmt = $db->prepare(
                  'SELECT COUNT(*) FROM information_schema.VIEWS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = ?'
              );
              $stmt->execute([$view]);
              if ((int) $stmt->fetchColumn() !== 1) {
                  throw new RuntimeException("Missing canonical view {$view}");
              }
          }

          foreach (['002_canonical_money.sql', '003_payment_method_registry.sql', '004_immutable_order_status_history.sql'] as $migration) {
              $stmt = $db->prepare('SELECT checksum FROM schema_migrations WHERE migration = ?');
              $stmt->execute([$migration]);
              $checksum = $stmt->fetchColumn();
              $path = 'sql/v1/migrations/' . $migration;
              if (!is_string($checksum) || $checksum !== hash('sha256', (string) file_get_contents($path))) {
                  throw new RuntimeException("Migration tracking invalid: {$migration}");
              }
          }
          PHP
