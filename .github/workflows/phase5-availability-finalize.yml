name: Phase 5 availability finalizer

on:
  push:
    branches:
      - v1/availability-calendar

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1/availability-calendar
          fetch-depth: 0

      - name: Apply availability integration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing marker in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # BusinessPolicy owns blackout dates and exact service-at validation.
          replace_once(
              'src/Domain/BusinessPolicy.php',
              "    public function customerCancellationCutoffHours(): int\n    {\n        return $this->requiredInt('order.cancellation_cutoff_hours', 0);\n    }\n",
              "    public function customerCancellationCutoffHours(): int\n    {\n        return $this->requiredInt('order.cancellation_cutoff_hours', 0);\n    }\n\n    /** @return list<string> */\n    public function blackoutDates(): array\n    {\n        $value = ($this->resolve)('order.blackout_dates');\n        if ($value === null) {\n            return [];\n        }\n        if (!is_array($value)) {\n            throw new ConfigurationInvalidException('Configuration invalid: order.blackout_dates');\n        }\n\n        $dates = [];\n        foreach ($value as $item) {\n            if (!is_string($item)) {\n                throw new ConfigurationInvalidException('Configuration invalid: order.blackout_dates');\n            }\n            $date = DateTimeImmutable::createFromFormat('!Y-m-d', $item);\n            if (!$date || $date->format('Y-m-d') !== $item) {\n                throw new ConfigurationInvalidException('Configuration invalid: order.blackout_dates');\n            }\n            $dates[$item] = $item;\n        }\n\n        ksort($dates, SORT_STRING);\n        return array_values($dates);\n    }\n\n    public function isBlackoutDate(string $date): bool\n    {\n        return in_array($date, $this->blackoutDates(), true);\n    }\n",
          )
          replace_once(
              'src/Domain/BusinessPolicy.php',
              "    public function assertOrderSchedule(DateTimeImmutable $serviceAt, DateTimeImmutable $now): void\n    {\n        $earliest = $now->modify('+' . $this->minimumOrderLeadHours() . ' hours');",
              "    public function assertOrderSchedule(DateTimeImmutable $serviceAt, DateTimeImmutable $now): void\n    {\n        if ($this->isBlackoutDate($serviceAt->format('Y-m-d'))) {\n            throw new InvalidArgumentException('Le traiteur est indisponible à cette date. Choisissez une autre date.');\n        }\n\n        $earliest = $now->modify('+' . $this->minimumOrderLeadHours() . ' hours');",
          )

          # Availability must account for the same current-month plan quota as reserve().
          replace_once(
              'src/Services/OrderAdmissionService.php',
              "    public static function countCommittedAndReservedForDay(PDO $db, string $datePrestation): int\n    {",
              "    public static function countCommittedAndReservedForCurrentMonth(PDO $db): int\n    {\n        $monthKey = date('Y-m');\n        return self::countOrdersForMonth($db, $monthKey)\n            + self::countActiveReservationsForMonth($db, $monthKey);\n    }\n\n    public static function countCommittedAndReservedForDay(PDO $db, string $datePrestation): int\n    {",
          )

          # Server form validation uses the same schedule policy engine.
          replace_once('src/Services/CommandeService.php', 'use App\\Config\\Configuration;\nuse App\\Domain\\BusinessPolicy;\n', '')
          replace_once(
              'src/Services/CommandeService.php',
              "        $policy = new BusinessPolicy(static fn(string $key): mixed => Configuration::get($key));\n        $policy->assertOrderSchedule($datePrestation, new DateTimeImmutable());",
              "        OrderAvailabilityService::assertServiceAt($datePrestation, new DateTimeImmutable());",
          )

          # Public availability endpoint delegates to the canonical engine.
          p = Path('src/Controllers/CommandeController.php')
          text = p.read_text()
          text = text.replace('use App\\Services\\OrderAdmissionService;\n', 'use App\\Services\\OrderAdmissionService;\nuse App\\Services\\OrderAvailabilityService;\n', 1)
          old = '''        try {\n            $count = OrderAdmissionService::countCommittedAndReservedForDay(\n                Database::getConnection(),\n                $date,\n            );\n        } catch (\\Throwable $e) {\n            error_log('[admission] calcul disponibilité impossible: ' . $e->getMessage());\n            http_response_code(503);\n            echo json_encode(['ok' => false, 'message' => 'Disponibilité temporairement indisponible.']);\n            return;\n        }\n\n        $max = SiteConfig::commandesMaxParJour();\n        echo json_encode([\n            'ok'      => true,\n            'count'   => $count,\n            'max'     => $max,\n            'complet' => $max > 0 && $count >= $max,\n        ]);'''
          new = '''        try {\n            $availability = OrderAvailabilityService::checkDate(Database::getConnection(), $date);\n        } catch (\\InvalidArgumentException $e) {\n            http_response_code(422);\n            echo json_encode(['ok' => false, 'message' => $e->getMessage()]);\n            return;\n        } catch (\\Throwable $e) {\n            error_log('[admission] calcul disponibilité impossible: ' . $e->getMessage());\n            http_response_code(503);\n            echo json_encode(['ok' => false, 'message' => 'Disponibilité temporairement indisponible.']);\n            return;\n        }\n\n        echo json_encode([\n            'ok' => true,\n            'available' => $availability['available'],\n            'reason' => $availability['reason'],\n            'message' => $availability['message'],\n            'count' => $availability['count'],\n            'max' => $availability['max'],\n            'month_count' => $availability['month_count'],\n            'month_max' => $availability['month_max'],\n            'complet' => !$availability['available'],\n        ]);'''
          if old not in text:
              raise SystemExit('availability endpoint block not found')
          p.write_text(text.replace(old, new, 1))

          # Tenant-configurable exceptional closed dates.
          replace_once(
              'src/Config/ConfigurationRegistry.php',
              "            self::tenant('order.capacity.max_per_day', 'commandes_max_par_jour', ConfigurationType::INTEGER, false, $admin, 'orders', 'Capacité maximale de commandes par jour.', null, ['min' => 0, 'max' => 999]),",
              "            self::tenant('order.capacity.max_per_day', 'commandes_max_par_jour', ConfigurationType::INTEGER, false, $admin, 'orders', 'Capacité maximale de commandes par jour.', null, ['min' => 0, 'max' => 999]),\n            self::tenant('order.blackout_dates', 'commande_dates_fermees', ConfigurationType::STRING_LIST, false, $admin, 'orders', 'Dates exceptionnelles fermées au format YYYY-MM-DD.', null, ['max_items' => 366]),",
          )
          replace_once(
              'src/Controllers/Admin/ParametresController.php',
              "        'commandes_max_par_jour',\n",
              "        'commandes_max_par_jour',\n        'commande_dates_fermees',\n",
          )

          # Expose blackout calendar next to daily capacity configuration.
          replace_once(
              'src/Views/pages/admin/parametres.php',
              '''                        <div class="col-6 col-lg-2">\n                            <label class="form-label fw-medium" for="commandes_max_par_jour">Commandes max / jour</label>\n                            <input type="number" class="form-control" id="commandes_max_par_jour" name="commandes_max_par_jour"\n                                   value="<?= (int)($config['commandes_max_par_jour'] ?? 0) ?>" min="0" max="999">\n                            <div class="form-text">0 = illimité.</div>\n                        </div>''',
              '''                        <div class="col-6 col-lg-2">\n                            <label class="form-label fw-medium" for="commandes_max_par_jour">Commandes max / jour</label>\n                            <input type="number" class="form-control" id="commandes_max_par_jour" name="commandes_max_par_jour"\n                                   value="<?= (int)($config['commandes_max_par_jour'] ?? 0) ?>" min="0" max="999">\n                            <div class="form-text">0 = illimité.</div>\n                        </div>\n                        <div class="col-12 col-lg-6">\n                            <label class="form-label fw-medium" for="commande_dates_fermees">Dates exceptionnellement fermées</label>\n                            <input type="text" class="form-control" id="commande_dates_fermees" name="commande_dates_fermees"\n                                   value="<?= htmlspecialchars($config['commande_dates_fermees'] ?? '') ?>"\n                                   maxlength="500" placeholder="2026-12-25,2027-01-01">\n                            <div class="form-text">Dates YYYY-MM-DD séparées par des virgules. Le checkout les refusera automatiquement.</div>\n                        </div>''',
          )

          # Checkout UI consumes the richer decision/message rather than only a raw daily count.
          replace_once(
              'src/Views/pages/panier/index.php',
              '''        if (data.complet) {\n            dispoIndicator.innerHTML = '<span class="text-danger"><i class="bi bi-calendar-x me-1"></i>Date complète — choisissez une autre date.</span>';\n            if (submitBtn) submitBtn.disabled = true;\n        } else if (data.max > 0) {''',
              '''        if (data.available === false) {\n            const message = data.message || 'Date indisponible — choisissez une autre date.';\n            dispoIndicator.innerHTML = '<span class="text-danger"><i class="bi bi-calendar-x me-1"></i>' + message + '</span>';\n            if (submitBtn) submitBtn.disabled = true;\n        } else if (data.max > 0) {''',
          )
          PY

          php -l src/Domain/BusinessPolicy.php
          php -l src/Services/OrderAdmissionService.php
          php -l src/Services/CommandeService.php
          php -l src/Controllers/CommandeController.php
          php -l src/Config/ConfigurationRegistry.php
          php -l src/Controllers/Admin/ParametresController.php
          php -l src/Views/pages/admin/parametres.php
          php -l src/Views/pages/panier/index.php

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Domain/BusinessPolicy.php src/Services/OrderAdmissionService.php src/Services/CommandeService.php src/Controllers/CommandeController.php src/Config/ConfigurationRegistry.php src/Controllers/Admin/ParametresController.php src/Views/pages/admin/parametres.php src/Views/pages/panier/index.php
          git commit -m 'Phase 5: unify availability calendar policy'
          git push origin HEAD:v1/availability-calendar
