name: Phase 5 status history finalizer

on:
  push:
    branches:
      - v1/order-status-history

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1/order-status-history
          fetch-depth: 0

      - name: Centralize status history writes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing marker in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # CommandeModel: initial history uses the canonical boundary; dead parallel mutation APIs disappear.
          p = Path('src/Models/CommandeModel.php')
          text = p.read_text()
          text = text.replace(
              'use App\\Services\\InventoryLedgerService;\n',
              'use App\\Services\\InventoryLedgerService;\nuse App\\Services\\OrderStatusHistoryService;\n',
              1,
          )
          text = text.replace(
              "            self::addHistorique($commandeId, null, OrderStatus::initial(), 'Commande passée', $commandeData['utilisateur_id']);",
              "            OrderStatusHistoryService::append(\n                $db,\n                $commandeId,\n                null,\n                OrderStatus::initial(),\n                'Commande passée',\n                (int) $commandeData['utilisateur_id'],\n            );",
              1,
          )
          text, count = re.subn(
              r"\n    public static function updateStatut\(int \$id, string \$statut, \?string \$commentaire, int \$modifiePar\): void \{.*?\n    \}\n\n    public static function updateDetails",
              '\n    public static function updateDetails',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('unable to remove CommandeModel::updateStatut')
          text, count = re.subn(
              r"\n    public static function cancel\(int \$id, string \$motif, string \$modeContact, int \$modifiePar\): void \{.*?\n    \}\n\n    public static function getHistorique",
              '\n    public static function getHistorique',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('unable to remove CommandeModel::cancel')
          text, count = re.subn(
              r"\n    public static function addHistorique\(int \$commandeId, \?string \$ancien, string \$nouveau, \?string \$commentaire, \?int \$modifiePar\): void \{.*?\n    \}\n",
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('unable to remove CommandeModel::addHistorique')
          p.write_text(text)

          # Normal transitions use the same append boundary.
          p = Path('src/Services/OrderTransitionService.php')
          text = p.read_text()
          old = '''            $history = $db->prepare(
                'INSERT INTO commande_historique
                    (commande_id, ancien_statut, nouveau_statut, commentaire, modifie_par)
                 VALUES (?, ?, ?, ?, ?)',
            );
            $history->execute([
                $commandeId,
                $ancienStatut,
                $nouveauStatut,
                $commentaire !== null && trim($commentaire) !== '' ? trim($commentaire) : null,
                $modifiePar,
            ]);'''
          new = '''            OrderStatusHistoryService::append(
                $db,
                $commandeId,
                $ancienStatut,
                $nouveauStatut,
                $commentaire,
                $modifiePar,
            );'''
          if old not in text:
              raise SystemExit('transition history block missing')
          p.write_text(text.replace(old, new, 1))

          # Cancellation keeps its side-effect transaction but delegates the audit append.
          p = Path('src/Services/OrderCancellationService.php')
          text = p.read_text()
          pattern = re.compile(
              r"\n            \$history = \$db->prepare\(\n                ['\"]INSERT INTO commande_historique.*?\n            \$history->execute\(\[.*?\n            \]\);",
              re.S,
          )
          replacement = '''
            OrderStatusHistoryService::append(
                $db,
                $commandeId,
                $oldStatus,
                OrderStatus::cancelled(),
                'Annulation (' . $modeContact . ') : ' . $motif,
                $modifiePar,
            );'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('cancellation history block missing')
          p.write_text(text)

          # Stripe creation is an initial status event inside the webhook transaction.
          p = Path('src/Services/StripeWebhookFulfillmentService.php')
          text = p.read_text()
          old = '''        CommandeModel::addHistorique(
            $commandeId,
            null,
            OrderStatus::initial(),
            'Commande payée et créée par webhook Stripe',
            null,
        );'''
          new = '''        OrderStatusHistoryService::append(
            $db,
            $commandeId,
            null,
            OrderStatus::initial(),
            'Commande payée et créée par webhook Stripe',
            null,
        );'''
          if old not in text:
              raise SystemExit('stripe initial history block missing')
          p.write_text(text.replace(old, new, 1))

          # Audit actors are anonymized, never detached from historical events.
          p = Path('src/Models/UserModel.php')
          text = p.read_text()
          old = '''    public static function deleteEmploye(int $id): void {
        $db = Database::getConnection();
        $db->prepare("UPDATE commande_historique SET modifie_par = NULL WHERE modifie_par = ?")->execute([$id]);
        $db->prepare("DELETE FROM password_reset WHERE utilisateur_id = ?")->execute([$id]);
        $db->prepare("DELETE FROM utilisateur WHERE utilisateur_id = ?")->execute([$id]);
    }'''
          new = '''    public static function deleteEmploye(int $id): void {
        $db = Database::getConnection();
        $db->beginTransaction();
        try {
            $db->prepare("DELETE FROM password_reset WHERE utilisateur_id = ?")->execute([$id]);
            $history = $db->prepare("SELECT 1 FROM commande_historique WHERE modifie_par = ? LIMIT 1");
            $history->execute([$id]);
            if ($history->fetchColumn() !== false) {
                $db->prepare(
                    "UPDATE utilisateur
                     SET email = ?, password = '*', prenom = 'Compte', nom = 'supprimé',
                         telephone = NULL, adresse = NULL, ville = NULL, code_postal = NULL,
                         actif = 0, must_change_password = 0
                     WHERE utilisateur_id = ? AND role_id = ?"
                )->execute(['employe-supprime-' . $id . '@supprime.invalid', $id, ROLE_ID_EMPLOYE]);
            } else {
                $db->prepare("DELETE FROM utilisateur WHERE utilisateur_id = ? AND role_id = ?")
                    ->execute([$id, ROLE_ID_EMPLOYE]);
            }
            $db->commit();
        } catch (\\Throwable $e) {
            if ($db->inTransaction()) {
                $db->rollBack();
            }
            throw $e;
        }
    }'''
          if old not in text:
              raise SystemExit('deleteEmploye block missing')
          p.write_text(text.replace(old, new, 1))
          PY

          php -l src/Models/CommandeModel.php
          php -l src/Services/OrderTransitionService.php
          php -l src/Services/OrderCancellationService.php
          php -l src/Services/StripeWebhookFulfillmentService.php
          php -l src/Models/UserModel.php

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Models/CommandeModel.php src/Services/OrderTransitionService.php src/Services/OrderCancellationService.php src/Services/StripeWebhookFulfillmentService.php src/Models/UserModel.php
          git commit -m 'Phase 5: centralize order status audit writes'
          git push origin HEAD:v1/order-status-history
