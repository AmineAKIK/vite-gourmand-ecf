name: Phase 4 canonical money one-shot

on:
  push:
    branches:
      - v1/canonical-money-pricing

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1/canonical-money-pricing
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, zip
          coverage: none
          tools: composer:v2, phpunit:10, phpstan:2.2, php-cs-fixer:3
      - run: python3 -m py_compile bin/phase4_money_refactor.py
      - run: python3 bin/phase4_money_refactor.py
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: find src public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
      - run: phpunit --configuration phpunit.xml
      - run: phpstan analyse --configuration=phpstan.neon --no-progress
      - name: Find unsafe cents presentation
        run: |
          set -euo pipefail
          if grep -RInE --include='*.php' 'formatPrice\([^\n]*(cents|basis_points)' src; then
            echo 'Cents/basis-points passed to decimal formatter.' >&2
            exit 1
          fi
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'Phase 4: use canonical minor units for transactional pricing'
          git push origin HEAD:v1/canonical-money-pricing
