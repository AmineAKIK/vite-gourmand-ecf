name: Phase 3 references one-shot

on:
  push:
    branches:
      - v1/white-label-references-assets

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1/white-label-references-assets
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, zip
          coverage: none
          tools: composer:v2, phpunit:10, phpstan:2.2
      - run: python3 -m py_compile bin/phase3_refs_refactor.py
      - run: python3 bin/phase3_refs_refactor.py
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: find src public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
      - run: phpunit --configuration phpunit.xml
      - run: phpstan analyse --configuration=phpstan.neon --no-progress
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'Phase 3: make references and brand assets tenant-semantic'
          git push origin HEAD:v1/white-label-references-assets
