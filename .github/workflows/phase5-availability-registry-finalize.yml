name: Phase 5 availability registry finalizer

on:
  push:
    branches:
      - v1/availability-calendar

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1/availability-calendar
          fetch-depth: 0
      - name: Pin blackout item format
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/Config/ConfigurationRegistry.php')
          text = p.read_text()
          old = "self::tenant('order.blackout_dates', 'commande_dates_fermees', ConfigurationType::STRING_LIST, false, $admin, 'orders', 'Dates exceptionnelles fermées au format YYYY-MM-DD.', null, ['max_items' => 366]),"
          new = "self::tenant('order.blackout_dates', 'commande_dates_fermees', ConfigurationType::STRING_LIST, false, $admin, 'orders', 'Dates exceptionnelles fermées au format YYYY-MM-DD.', null, ['max_items' => 366, 'item_pattern' => '/^\\d{4}-\\d{2}-\\d{2}$/']),"
          if old not in text:
              raise SystemExit('blackout registry marker missing')
          p.write_text(text.replace(old, new, 1))
          PY
          php -l src/Config/ConfigurationRegistry.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Config/ConfigurationRegistry.php
          git commit -m 'Phase 5: reject malformed blackout dates at write boundary'
          git push origin HEAD:v1/availability-calendar
