name: Phase 4 money finalizer one-shot

on:
  push:
    branches:
      - v1/canonical-money-pricing

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1/canonical-money-pricing
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, zip
          coverage: none
          tools: composer:v2, phpunit:10, phpstan:2.2, php-cs-fixer:3
      - run: python3 -m py_compile bin/phase4_money_finalize.py bin/phase4_money_stripe_finalize.py
      - run: python3 bin/phase4_money_finalize.py
      - run: python3 bin/phase4_money_stripe_finalize.py
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: find src public tests bin -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
      - run: phpunit --configuration phpunit.xml
      - run: phpstan analyse --configuration=phpstan.neon --no-progress
      - name: Reject stale transactional persistence contracts
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.php' '(computeDeliveryPrice\(|defaultTauxTvaByCategorie\(|taux_tva_basis_points|taux_tva_id)' src; then
            echo 'Stale persisted money contract found.' >&2
            exit 1
          fi
      - name: Commit finalized runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'Phase 4: finalize exact transactional money contract'
          git push origin HEAD:v1/canonical-money-pricing
