name: Temporary payment registry formatter

on:
  push:
    branches:
      - v1/payment-method-registry

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: php-cs-fixer:3
      - name: Apply the exact CI style rules
        run: |
          php-cs-fixer fix src/Services/PaymentMethodRegistry.php --using-cache=no --rules=@PER-CS2.0
          php -l src/Services/PaymentMethodRegistry.php
          rm .github/workflows/temp-format-payment-registry.yml
          git diff --check
      - name: Commit formatter-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: format payment-method registry"
          git push
