name: Phase 5 inventory finalizer

on:
  push:
    branches:
      - v1/inventory-invariants

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1/inventory-invariants
          fetch-depth: 0

      - name: Apply canonical inventory integration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing replacement marker in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/Models/CommandeModel.php',
              'use App\\Models\\NotificationModel;\nuse RuntimeException;',
              'use App\\Models\\NotificationModel;\nuse App\\Services\\InventoryLedgerService;\nuse RuntimeException;',
          )
          replace_once(
              'src/Models/CommandeModel.php',
              "            self::addHistorique($commandeId, null, OrderStatus::initial(), 'Commande passée', $commandeData['utilisateur_id']);",
              "            InventoryLedgerService::consumeOrder($db, $commandeId, (int) $commandeData['utilisateur_id']);\n\n            self::addHistorique($commandeId, null, OrderStatus::initial(), 'Commande passée', $commandeData['utilisateur_id']);",
          )

          p = Path('src/Controllers/CommandeController.php')
          text = p.read_text()
          pattern = re.compile(
              r"\n        // La consommation de stock reste non bloquante.*?\n        \$userFull = UserModel::findById",
              re.S,
          )
          text, count = pattern.subn('\n\n        $userFull = UserModel::findById', text, count=1)
          if count != 1:
              raise SystemExit('unable to remove non-blocking offline stock path')
          p.write_text(text)

          replace_once('src/Services/StripeWebhookFulfillmentService.php', 'use App\\Models\\StockModel;\n', '')
          replace_once(
              'src/Services/StripeWebhookFulfillmentService.php',
              '            StockModel::consommerPourCommande($commandeId, null);',
              '            InventoryLedgerService::consumeOrder($db, $commandeId, null);',
          )

          replace_once(
              'src/Controllers/Workspace/RecetteController.php',
              'use App\\Services\\CatalogIntegrityService;\n',
              'use App\\Services\\RecipeService;\n',
          )
          replace_once(
              'src/Controllers/Workspace/RecetteController.php',
              '            CatalogIntegrityService::saveRecipe($platId, $lignes);',
              '            RecipeService::save($platId, $lignes);',
          )
          replace_once(
              'src/Controllers/Workspace/RecetteController.php',
              "        $quantite = (float) str_replace(',', '.', $_POST['quantite'] ?? 0);",
              "        $quantite = trim((string) ($_POST['quantite'] ?? ''));",
          )
          replace_once(
              'src/Views/pages/employe/recettes.php',
              '                        <option value="ajustement">Ajustement (inventaire)</option>\n',
              '',
          )

          p = Path('src/Services/CatalogIntegrityService.php')
          text = p.read_text()
          text, count = re.subn(
              r"\n    public static function saveRecipe\(int \$platId, array \$lines\): void\n    \{.*?\n    \}\n\n    /\*\* @return array\{path:string,menu_id:int\}\|null \*/",
              '\n    /** @return array{path:string,menu_id:int}|null */',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('unable to extract saveRecipe from CatalogIntegrityService')
          text, count = re.subn(
              r"\n    private static function assertActiveIngredientIds\(PDO \$db, array \$ids\): void\n    \{.*?\n    \}\n\n    private static function assertIdsExist",
              '\n    private static function assertIdsExist',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('unable to remove recipe-only ingredient helper')
          p.write_text(text)

          p = Path('src/Models/IngredientModel.php')
          text = p.read_text()
          start = text.find('    public static function create(array $data): int')
          end = text.find('    /** Stock courant calculé depuis les mouvements */')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('unable to remove IngredientModel write API')
          p.write_text(text[:start] + text[end:])

          p = Path('src/Models/RecetteModel.php')
          text = p.read_text()
          marker = '    /** Sauvegarde toutes les lignes de recette'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('unable to remove RecetteModel sync API')
          p.write_text(text[:start].rstrip() + '\n}\n')

          replace_once(
              'src/Models/StockModel.php',
              'public static function addMouvement(int $ingredientId, string $type, float $quantite, ?string $motif, ?int $commandeId, ?int $creePar): int',
              'public static function addMouvement(int $ingredientId, string $type, mixed $quantite, ?string $motif, ?int $commandeId, ?int $creePar): int',
          )
          PY

          php -l src/Models/CommandeModel.php
          php -l src/Controllers/CommandeController.php
          php -l src/Services/StripeWebhookFulfillmentService.php
          php -l src/Controllers/Workspace/RecetteController.php
          php -l src/Services/CatalogIntegrityService.php
          php -l src/Models/IngredientModel.php
          php -l src/Models/RecetteModel.php
          php -l src/Models/StockModel.php

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Models/CommandeModel.php src/Controllers/CommandeController.php src/Services/StripeWebhookFulfillmentService.php src/Controllers/Workspace/RecetteController.php src/Views/pages/employe/recettes.php src/Services/CatalogIntegrityService.php src/Models/IngredientModel.php src/Models/RecetteModel.php src/Models/StockModel.php
          git commit -m 'Phase 5: enforce recipe and inventory transaction invariants'
          git push origin HEAD:v1/inventory-invariants
